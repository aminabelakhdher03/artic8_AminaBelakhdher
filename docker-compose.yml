services:

  mysql:
    image: mysql:8.0
    container_name: mysql-app
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: aminabelakhdher/aminabelakhdher-ab2-appgestiondesprojets:latest
    container_name: backend-app
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8082:8080"

  frontend:
    image: aminabelakhdher/aminabelakhdher-ab2-appgestiondesprojets-frontend:latest
    container_name: frontend-app
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
